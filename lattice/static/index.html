<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice Simulation Engine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar" aria-label="Engine controls">
            <div class="brand">
                <div class="logo" aria-hidden="true">L</div>
                <h1>Lattice <span>Engine</span></h1>
            </div>

            <!-- Block Selector -->
            <section class="section" aria-labelledby="heading-selector">
                <h2 id="heading-selector">Select Material</h2>
                <div class="block-selector" id="block-selector" role="radiogroup" aria-label="Block materials">
                    <!-- Loaded dynamically from API -->
                </div>
            </section>

            <!-- Simulation Controls -->
            <section class="section" aria-labelledby="heading-simulation">
                <h2 id="heading-simulation">Simulation</h2>
                <div class="control-row">
                    <button id="btn-step" class="btn primary">Step Tick</button>
                    <button id="btn-play" class="btn success">Play</button>
                </div>
                <div class="control-group">
                    <label for="speed-slider">Tick Interval: <span id="speed-val">100</span>ms</label>
                    <input type="range" id="speed-slider" min="50" max="1000" step="50" value="100">
                </div>
            </section>

            <!-- Draw/Fill Tool -->
            <section class="section" aria-labelledby="heading-fill">
                <h2 id="heading-fill">Fill Tool</h2>
                <div class="form-grid">
                    <div class="input-wrapper">
                        <label for="fill-x1">X1</label>
                        <input type="number" id="fill-x1" class="form-input" value="0">
                    </div>
                    <div class="input-wrapper">
                        <label for="fill-y1">Y1</label>
                        <input type="number" id="fill-y1" class="form-input" value="0">
                    </div>
                    <div class="input-wrapper">
                        <label for="fill-x2">X2</label>
                        <input type="number" id="fill-x2" class="form-input" value="0">
                    </div>
                    <div class="input-wrapper">
                        <label for="fill-y2">Y2</label>
                        <input type="number" id="fill-y2" class="form-input" value="0">
                    </div>
                </div>
                <button id="btn-fill" class="btn secondary">Execute Fill</button>
            </section>

            <!-- Chunk Utilities -->
            <section class="section" aria-labelledby="heading-chunks">
                <h2 id="heading-chunks">Chunk Settings</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="chk-grid-overlay" checked>
                    <label for="chk-grid-overlay">Show Chunk Borders</label>
                </div>
                <div class="form-row">
                    <div class="input-wrapper">
                        <label for="chunk-cx">CX</label>
                        <input type="number" id="chunk-cx" class="form-input" value="0">
                    </div>
                    <div class="input-wrapper">
                        <label for="chunk-cy">CY</label>
                        <input type="number" id="chunk-cy" class="form-input" value="0">
                    </div>
                </div>
                <div class="control-row">
                    <button id="btn-load-chunk" class="btn accent-btn">Force Load</button>
                    <button id="btn-unload-chunk" class="btn warning-btn">Unload</button>
                </div>
            </section>

            <!-- Reset World -->
            <section class="section" aria-labelledby="heading-reset">
                <h2 id="heading-reset">Reset World</h2>
                <div class="form-grid">
                    <div class="input-wrapper">
                        <label for="reset-w">W</label>
                        <input type="number" id="reset-w" class="form-input" value="48">
                    </div>
                    <div class="input-wrapper">
                        <label for="reset-h">H</label>
                        <input type="number" id="reset-h" class="form-input" value="48">
                    </div>
                    <div class="input-wrapper">
                        <label for="reset-cs">Size</label>
                        <input type="number" id="reset-cs" class="form-input" value="16">
                    </div>
                </div>
                <button id="btn-reset" class="btn danger-btn">Reset</button>
            </section>

            <!-- Snapshots -->
            <section class="section" aria-labelledby="heading-snapshots">
                <h2 id="heading-snapshots">Snapshots</h2>
                <div class="control-row">
                    <button id="btn-export" class="btn">Copy JSON</button>
                    <button id="btn-import" class="btn">Load JSON</button>
                </div>
                <label for="txt-snapshot" class="sr-only">Snapshot JSON</label>
                <textarea id="txt-snapshot" class="form-textarea" placeholder="Paste snapshot JSON here to import..."></textarea>
            </section>
        </aside>

        <!-- Main Viewport -->
        <main class="viewport" role="main">
            <header class="top-bar">
                <div id="coord-info" class="coord-info" role="status">
                    Hover canvas to inspect cells
                </div>
                <div class="controls-hint">
                    Drag: Pan | Scroll: Zoom | Click: Draw | Shift+Click: Load/Unload Chunk
                </div>
            </header>

            <div class="canvas-container" id="canvas-container" tabindex="0" aria-label="Interactive world canvas grid">
                <canvas id="world-canvas"></canvas>
            </div>

            <footer class="status-bar">
                <div class="status-item">Grid: <span id="status-size">0x0</span></div>
                <div class="status-item">Chunks: <span id="status-chunks">0</span></div>
                <div class="status-item">Loaded Chunks: <span id="status-loaded-chunks">0</span></div>
            </footer>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
